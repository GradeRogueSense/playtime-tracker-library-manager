[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playtime-tracker-library-manager"
version = "0.9.4"
description = "Windows desktop playtime tracker and library manager for multi-store game collections."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ptlm maintainers" }]
keywords = ["playtime", "tracker", "library", "steam", "epic", "gog", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "psutil>=5.9.6",
    "pywin32>=306; sys_platform == 'win32'",
    "watchdog>=4.0.0",
    "SQLAlchemy>=2.0.25",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "tomli-w>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "freezegun>=1.4.0",
]

[project.scripts]
ptlm = "playtime_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]